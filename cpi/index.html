<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消費者物価 品目別「買い時」カレンダー｜調達人材の相場確認サイト（未来調達研究所）</title>
<meta name="description" content="総務省・消費者物価指数（全国・品目別）から、品目ごとに直近5年の1〜12月の値動きと「何月が安い・何月が高い」という季節傾向を示します。毎月自動更新。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a2620; --ink-soft:#3a4a40; --ink-mute:#6f7d73;
    --paper:#f4f7f2; --paper-warm:#e8efe4; --paper-deep:#dde6d6;
    --accent:#2d5f3f; --accent-deep:#1f4530; --accent-bright:#4a8862; --rule:#c5d2bd;
    --up:#9c3b2e; --down:#2a5f7a;
    --serif-jp:'Shippori Mincho',"Hiragino Mincho ProN","Yu Mincho",serif;
    --mono:'JetBrains Mono',Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif-jp);font-size:18px;line-height:1.8}
  a{color:var(--accent)}
  .container{max-width:1100px;margin:0 auto;padding:0 24px 60px}
  header{padding:28px 0 18px;border-bottom:2px solid var(--accent)}
  .mast-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .mast-copy{color:var(--ink-mute);font-size:15px}
  h1{font-size:34px;line-height:1.35;margin:14px 0 4px;font-weight:700;letter-spacing:.02em}
  .subtitle{color:var(--ink-soft);font-size:17px;margin:0}
  .tagline{margin:14px 0 6px;color:var(--ink-soft);font-size:17px}
  .meta-line{color:var(--ink-mute);font-size:15px}
  .nav{margin:10px 0 0;font-size:15.5px}
  .picker{margin:26px 0 10px;background:var(--paper-warm);border:1px solid var(--rule);padding:18px 20px}
  .picker label{display:block;font-weight:600;margin-bottom:6px}
  .picker-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .picker-row > div{flex:1 1 260px}
  .overview tr{cursor:pointer} .overview tr:hover td{background:var(--paper-warm)} .overview td.name{font-weight:600;text-align:left}
  .btn{font:inherit;font-size:17px;padding:9px 18px;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer} .btn:hover{background:var(--accent-deep)}
  .item-block{border-top:3px double var(--rule);margin-top:30px;padding-top:6px;break-inside:avoid;page-break-inside:avoid}
  @media print{ .btn{display:none} .item-block{break-before:page;page-break-before:always;border-top:none} }
  .tri{display:grid;grid-template-columns:1fr;gap:10px}
  h3{font-size:20px;margin:18px 0 6px;font-weight:700}
  .tri th,.tri td{padding:6px 10px}
  .tag{display:inline-block;padding:1px 8px;border-radius:3px;font-size:14.5px;background:var(--paper-deep)}
  select,input[type=text]{width:100%;font:inherit;font-size:18px;padding:9px 12px;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:4px}
  .hint{color:var(--ink-mute);font-size:14.5px;margin:6px 0 0}
  h2{font-size:26px;margin:34px 0 8px;font-weight:700;border-left:6px solid var(--accent);padding-left:12px;line-height:1.4}
  .lead{color:var(--ink-soft);font-size:16.5px;margin:0 0 12px}
  .chart-box{background:#fff;border:1px solid var(--rule);padding:14px 10px 6px;overflow-x:auto}
  svg text{font-family:var(--serif-jp)}
  .verdict{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
  .verdict .card{background:#fff;border:1px solid var(--rule);padding:16px 18px}
  .verdict .card b{display:block;font-size:15px;color:var(--ink-mute);font-weight:500;margin-bottom:4px}
  .verdict .card .big{font-size:30px;font-weight:700;line-height:1.3}
  .verdict .cheap .big{color:var(--down)} .verdict .dear .big{color:var(--up)}
  .verdict .card .sub{font-size:15.5px;color:var(--ink-soft)}
  table{border-collapse:collapse;width:100%;background:#fff;font-size:17px}
  th,td{border:1px solid var(--rule);padding:8px 10px;text-align:right;white-space:nowrap}
  th{background:var(--paper-deep);font-weight:600;text-align:center}
  td:first-child,th:first-child{text-align:left}
  .season-grid td.m{font-family:var(--mono);font-size:16px}
  .neg{color:var(--down);font-weight:600} .pos{color:var(--up);font-weight:600}
  .bar{display:inline-block;height:12px;vertical-align:middle;border-radius:2px}
  .stats{display:flex;gap:26px;flex-wrap:wrap;margin:8px 0 0;font-size:16.5px;color:var(--ink-soft)}
  .note{color:var(--ink-mute);font-size:14.5px;margin-top:12px}
  footer{margin-top:50px;border-top:1px solid var(--rule);padding-top:16px;color:var(--ink-mute);font-size:14.5px}
  @media(max-width:700px){ .container{padding:0 14px 40px} h1{font-size:27px} .verdict{grid-template-columns:1fr} table{font-size:15px} th,td{padding:6px 6px} body{font-size:17px} }
  @media print{ .picker,.nav,footer{display:none} body{background:#fff} }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="mast-top"><a href="https://www.future-procurement.com/" target="_blank" rel="noopener"><img src="https://www.future-procurement.com/logo.png" alt="未来調達研究所株式会社" style="height:54px;width:auto"></a><span class="mast-copy">調達人材が必要な市況データ、すべて集めました</span></div>
    <h1>消費者物価 品目別「買い時」カレンダー</h1>
    <p class="subtitle">品目ごとに「何月が安く、何月が高いか」を過去の値動きから示します</p>
    <p class="tagline">総務省「消費者物価指数」（全国・品目別・月次）から、直近5年分の1〜12月の値動きを重ねて表示し、各年の年平均＝100とした月別の乖離を平均して季節傾向を出しています。データは総務省の公表後、毎月自動で更新されます。</p>
    <div class="meta-line" id="metaLine">データ読み込み中…</div>
    <div class="nav"><a href="../">← 値上げ妥当性シミュレーター（企業物価・賃金）へ戻る</a></div>
  </header>

  <div class="picker">
    <div class="picker-row">
      <div><label for="store">どこで買うもの？（店の種類で絞り込み）</label><select id="store"><option value="">すべて</option></select></div>
      <div><label for="filter">品目を探す（一部の文字で絞り込み）</label><input type="text" id="filter" placeholder="例：キャベツ、ビール、電気代"></div>
      <div><label for="item">品目を選ぶ</label><select id="item"></select></div>
    </div>
    <p class="hint" id="hint"></p>
  </div>

  <div id="monthly"></div>
  <div id="overview"></div>
  <div id="main"></div>

  <footer>
    <div id="srcLine"></div>
    <div>年平均比（季節傾向）は過去の傾向であり、当年の価格を保証するものではありません。制作：未来調達研究所株式会社</div>
  </footer>
</div>

<script>
const COLORS=["#2d5f3f","#9c3b2e","#2a5f7a","#b08a2e","#6b4c9a","#1a2620","#e07b39"];
const MONTHS=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
let DATA=null, byCode=new Map();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

fetch("data.json?v="+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d; d.items.forEach(i=>byCode.set(i.code,i));
  const ly=Math.floor(d.latest_month/100), lm=d.latest_month%100;
  document.getElementById("metaLine").textContent=`データ最新月：${ly}年${lm}月 ／ 更新：${d.updated} ／ 収録：${d.items.filter(i=>i.leaf).length}品目＋分類 ${d.items.filter(i=>!i.leaf).length}`;
  document.getElementById("srcLine").textContent="出典："+d.source;
  const ss=document.getElementById("store");
  (d.stores||[]).forEach(st=>{const n=d.items.filter(i=>i.store===st).length; if(!n) return; const o=document.createElement("option"); o.value=st; o.textContent=`${st}（${n}品目）`; ss.appendChild(o);});
  const h=decodeURIComponent(location.hash.slice(1));
  const first=byCode.has(h)?h:(d.items.find(i=>i.leaf)||d.items[0]).code;
  const params=new URLSearchParams(location.search); if(params.get("store")&&[...ss.options].some(o=>o.value===params.get("store"))) ss.value=params.get("store");
  buildSelect(""); renderMonthly(); renderOverview();
  const sel=document.getElementById("item"); if([...sel.options].some(o=>o.value===first)) sel.value=first; render(sel.value||first);
});

function buildSelect(q){
  const sel=document.getElementById("item"); const cur=sel.value; sel.innerHTML="";
  let n=0;
  const st=document.getElementById("store").value;
  for(const it of DATA.items){
    if(st && it.store!==st) continue;
    if(q && !it.name.includes(q)) continue;
    const o=document.createElement("option"); o.value=it.code;
    o.textContent=(it.leaf?"　".repeat(Math.max(0,Math.min(it.level-1,4)))+it.name:"【"+it.name+"】");
    sel.appendChild(o); n++;
  }
  document.getElementById("hint").textContent=q?`「${q}」を含む ${n} 件。【 】は分類（複数品目の合成）`:"【 】は分類（複数品目の合成）。文字を入れると絞り込めます";
  if([...sel.options].some(o=>o.value===cur)) sel.value=cur;
}
document.getElementById("filter").addEventListener("input",e=>{buildSelect(e.target.value.trim()); const v=document.getElementById("item").value; if(v) render(v);});
document.getElementById("item").addEventListener("change",e=>render(e.target.value));
document.getElementById("store").addEventListener("change",e=>{buildSelect(document.getElementById("filter").value.trim()); renderOverview(); const v=document.getElementById("item").value; if(v) render(v);});

function bargainPool(){
  return DATA.items.filter(i=>i.leaf&&i.season&&i.season_years>=3&&i.store&&i.store!=="分析用の合成系列"&&i.store!=="教育・保育・習い事");
}
function renderMonthly(){
  const box=document.getElementById("monthly");
  const now=new Date(Date.now()+9*3600*1000); const curM=now.getUTCMonth()+1;
  const sel=box.querySelector("#monthSel"); const m=sel?+sel.value:curM; const idx=m-1;
  const ly=Math.floor(DATA.latest_month/100), lm=DATA.latest_month%100;
  const pool=bargainPool();
  const cheap=pool.slice().sort((a,b)=>a.season[idx]-b.season[idx]).slice(0,10);
  const dear=pool.slice().sort((a,b)=>b.season[idx]-a.season[idx]).slice(0,10);
  const real=pool.filter(i=>i.season.indexOf(Math.min(...i.season))===idx&&i.yoy!=null&&i.yoy<0).sort((a,b)=>a.season[idx]-b.season[idx]).slice(0,10);
  const sname=i=>i.store.split("（")[0];
  const row=(i,n)=>`<tr data-code="${i.code}"><td>${n+1}</td><td class="name">${esc(i.name)}</td><td><span class="tag">${esc(sname(i))}</span></td><td class="${cls(i.season[idx])}">${i.season[idx]>0?"+":""}${i.season[idx].toFixed(1)}%</td><td class="${cls(i.yoy)}">${pct(i.yoy)}</td></tr>`;
  const head=`<thead><tr><th>順位</th><th>品目</th><th>店</th><th>${m}月の年平均比</th><th>前年比（${lm}月）</th></tr></thead>`;
  const opts=MONTHS.map((x,i)=>`<option value="${i+1}"${i+1===m?" selected":""}>${x}${i+1===curM?"（今月）":""}</option>`).join("");
  let h=`<h2>${m}月のお買い得・買い控え品目</h2>`;
  h+=`<p class="lead">過去の値動きから、${m}月に年平均より安くなりやすい品目と高くなりやすい品目。月を変えて見ることもできます： <select id="monthSel" style="width:auto;display:inline-block;font-size:17px;padding:5px 10px">${opts}</select></p>`;
  h+=`<div class="tri">`;
  h+=`<div style="overflow-x:auto"><h3>安くなりやすい TOP10</h3><table class="overview">${head}<tbody>${cheap.map(row).join("")}</tbody></table></div>`;
  h+=`<div style="overflow-x:auto"><h3>高くなりやすい TOP10（買い控え）</h3><table class="overview">${head}<tbody>${dear.map(row).join("")}</tbody></table></div>`;
  h+=`</div>`;
  h+=`<h3>本当のお買い得：${m}月が年内で最も安い月で、しかも前年より安い品目</h3>`;
  h+=real.length?`<table class="overview">${head}<tbody>${real.map(row).join("")}</tbody></table>`:`<p class="lead">該当なし</p>`;
  h+=`<p class="note">対象：${pool.length}品目（授業料などの制度価格、分析用の合成系列は除く）。年平均比は${DATA.years[0]}年以降の季節傾向、前年同月比はデータ最新月の値。行を押すとその品目のグラフに移ります。</p>`;
  box.innerHTML=h;
  box.querySelector("#monthSel").addEventListener("change",renderMonthly);
  box.querySelectorAll("tr[data-code]").forEach(tr=>tr.addEventListener("click",()=>{const c=tr.dataset.code; const st=document.getElementById("store"); if(st.value&&byCode.get(c).store!==st.value){st.value=""; renderOverview();} document.getElementById("filter").value=""; buildSelect(""); document.getElementById("item").value=c; render(c); document.getElementById("main").scrollIntoView({behavior:"smooth"});}));
}
function renderOverview(){
  const st=document.getElementById("store").value; const box=document.getElementById("overview");
  if(!st){box.innerHTML=""; return;}
  const ly=Math.floor(DATA.latest_month/100), lm=DATA.latest_month%100;
  const tm=lm%12+1, ty=lm===12?ly+1:ly;   // データ最新月の翌月＝いまの月
  const idx=tm-1;
  const items=DATA.items.filter(i=>i.store===st&&i.season);
  const rows=items.map(i=>({i,v:i.season[idx]})).sort((a,b)=>a.v-b.v);
  const cheap=rows.filter(r=>r.v<=-1).length, dear=rows.filter(r=>r.v>=1).length;
  let h=`<h2>${esc(st)}：${ty}年${tm}月の「買い時」一覧</h2>`;
  h+=`<p class="lead">${items.length}品目のうち、${tm}月が年平均より安くなりやすいのは <b class="neg">${cheap}品目</b>、高くなりやすいのは <b class="pos">${dear}品目</b>。安い順に並べています。行を押すとその品目のグラフに移ります。</p>`;
  h+=`<div style="overflow-x:auto"><table class="overview"><thead><tr><th>品目</th><th>${tm}月の年平均比</th><th>判定</th><th>最安月</th><th>最高月</th><th>前年同月比（${ly}年${lm}月）</th></tr></thead><tbody>`;
  rows.forEach(({i,v})=>{
    const s=i.season, mn=s.indexOf(Math.min(...s))+1, mx=s.indexOf(Math.max(...s))+1;
    const j=v<=-3?"買い時":v<=-1?"やや安い":v>=3?"高い時期":v>=1?"やや高い":"平均並み";
    h+=`<tr data-code="${i.code}"><td class="name">${esc(i.name)}</td><td class="${cls(v)}">${v>0?"+":""}${v.toFixed(1)}%</td><td style="text-align:center"><span class="tag ${v<=-1?"neg":v>=1?"pos":""}">${j}</span></td><td>${mn}月（${s[mn-1].toFixed(1)}%）</td><td>${mx}月（+${s[mx-1].toFixed(1)}%）</td><td class="${cls(i.yoy)}">${pct(i.yoy)}</td></tr>`;
  });
  h+=`</tbody></table></div><p style="margin:14px 0"><button type="button" class="btn" id="showAll">この店の全${items.length}品目のグラフと表をまとめて表示</button></p><p class="note">判定：年平均比 -3%以下＝買い時、-1%以下＝やや安い、+1%以上＝やや高い、+3%以上＝高い時期。店の分類は目安です。</p>`;
  box.innerHTML=h;
  document.getElementById("showAll").addEventListener("click",()=>{renderAll(st); document.getElementById("main").scrollIntoView({behavior:"smooth"});});
  box.querySelectorAll("tr[data-code]").forEach(tr=>tr.addEventListener("click",()=>{const c=tr.dataset.code; const sel=document.getElementById("item"); if(![...sel.options].some(o=>o.value===c)){document.getElementById("filter").value=""; buildSelect("");} sel.value=c; render(c); document.getElementById("main").scrollIntoView({behavior:"smooth"});}));
}

function render(code){
  const it=byCode.get(code); if(!it) return;
  const stv=document.getElementById("store").value;
  history.replaceState(null,"",(stv?"?store="+encodeURIComponent(stv):location.pathname)+"#"+encodeURIComponent(code));
  document.getElementById("main").innerHTML=itemHTML(it);
}
function renderAll(st){
  const items=DATA.items.filter(i=>i.store===st);
  const main=document.getElementById("main");
  main.innerHTML=`<p class="lead" style="margin-top:20px">${esc(st)}の全${items.length}品目を表示しています。ブラウザの印刷機能でPDFにできます。<button type="button" class="btn" id="backOne">1品目ずつの表示に戻る</button></p>`+items.map(i=>`<section class="item-block">${itemHTML(i)}</section>`).join("");
  document.getElementById("backOne").addEventListener("click",()=>render(document.getElementById("item").value));
}
function itemHTML(it){
  const ly=Math.floor(DATA.latest_month/100), lm=DATA.latest_month%100;
  const years=Object.keys(it.years).sort();
  let html=`<h2>${esc(it.name)}${it.leaf?"":"（分類）"}${it.store?` <span class="tag">${esc(it.store)}</span>`:""}</h2>`;
  html+=`<p class="lead">直近${years.length}年の1〜12月の値動き（2020年平均＝100の指数）。線が下にある月ほど安い。</p>`;
  html+=`<div class="chart-box">${chartSVG(it,years)}</div>`;
  html+=`<div class="stats"><span>最新（${ly}年${lm}月）：<b>${fmt(it.latest)}</b></span><span>前年同月比：<b class="${cls(it.yoy)}">${pct(it.yoy)}</b></span><span>前月比：<b class="${cls(it.mom)}">${pct(it.mom)}</b></span></div>`;

  if(it.season){
    const s=it.season; const mn=s.indexOf(Math.min(...s)), mx=s.indexOf(Math.max(...s));
    const amp=Math.max(...s)-Math.min(...s);
    const cheapM=s.map((v,i)=>[v,i]).filter(x=>x[0]<=-1).sort((a,b)=>a[0]-b[0]).map(x=>MONTHS[x[1]]);
    const dearM=s.map((v,i)=>[v,i]).filter(x=>x[0]>=1).sort((a,b)=>b[0]-a[0]).map(x=>MONTHS[x[1]]);
    html+=`<h2>何月が安い？ 何月が高い？</h2>`;
    html+=`<p class="lead">各年の年平均を100として、月ごとの乖離を${it.season_years}年分平均したもの（季節傾向）。</p>`;
    html+=`<div class="verdict">
      <div class="card cheap"><b>安くなりやすい月</b><div class="big">${MONTHS[mn]}（年平均比 ${s[mn].toFixed(1)}%）</div><div class="sub">${cheapM.length?"年平均より1%以上安い月："+cheapM.join("・"):"年平均より1%以上安い月はない"}</div></div>
      <div class="card dear"><b>高くなりやすい月</b><div class="big">${MONTHS[mx]}（年平均比 +${s[mx].toFixed(1)}%）</div><div class="sub">${dearM.length?"年平均より1%以上高い月："+dearM.join("・"):"年平均より1%以上高い月はない"}</div></div>
    </div>`;
    html+=`<p class="lead">${amp>=10?"季節による差が非常に大きい品目です（最安月と最高月の差 "+amp.toFixed(1)+"ポイント）。買う時期で値段が大きく変わります。":amp>=3?"季節による差がある品目です（最安月と最高月の差 "+amp.toFixed(1)+"ポイント）。":"季節による差はほとんどありません（最安月と最高月の差 "+amp.toFixed(1)+"ポイント）。時期より価格トレンドで判断する品目です。"}</p>`;
    html+=seasonTable(it);
  }else{
    html+=`<p class="note">1〜12月が揃った年が無いため、季節傾向は算出していません。</p>`;
  }
  html+=yearTable(it,years);
  return html;
}

function chartSVG(it,years){
  const W=920,H=420,L=64,R=175,T=20,B=44;
  const all=[]; years.forEach(y=>it.years[y].forEach(v=>{if(v!=null)all.push(v)}));
  let lo=Math.min(...all), hi=Math.max(...all); const pad=(hi-lo)*0.12||1; lo-=pad; hi+=pad;
  const X=i=>L+(W-L-R)*i/11, Y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:640px;display:block">`;
  const ticks=niceTicks(lo,hi,6);
  ticks.forEach(t=>{s+=`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="#c5d2bd" stroke-width="1"/><text x="${L-8}" y="${Y(t)+5}" text-anchor="end" font-size="14" fill="#3a4a40">${t}</text>`;});
  MONTHS.forEach((m,i)=>{s+=`<text x="${X(i)}" y="${H-B+24}" text-anchor="middle" font-size="15" fill="#1a2620">${m}</text>`;});
  years.forEach((y,k)=>{
    const c=COLORS[k%COLORS.length]; const vals=it.years[y];
    let d="", prev=false;
    vals.forEach((v,i)=>{ if(v==null){prev=false;return;} d+=(prev?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1); prev=true; });
    const last=k===years.length-1;
    s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${last?4:2.6}" stroke-linejoin="round" stroke-linecap="round"/>`;
    vals.forEach((v,i)=>{ if(v==null)return; s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${last?4.5:3}" fill="${c}"><title>${y}年${MONTHS[i]}：${v}</title></circle>`; });
    const ly=T+18+k*26;
    s+=`<line x1="${W-R+16}" x2="${W-R+48}" y1="${ly}" y2="${ly}" stroke="${c}" stroke-width="${last?4:2.6}"/><text x="${W-R+56}" y="${ly+5}" font-size="16" fill="#1a2620">${y}年${last?"（最新）":""}</text>`;
  });
  s+=`<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="#3a4a40"/>`;
  return s+"</svg>";
}
function niceTicks(lo,hi,n){const span=hi-lo, raw=span/n, mag=Math.pow(10,Math.floor(Math.log10(raw))); const step=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw); const out=[]; for(let t=Math.ceil(lo/step)*step;t<=hi;t+=step) out.push(+t.toFixed(4)); return out;}

function seasonTable(it){
  const s=it.season, maxAbs=Math.max(1,...s.map(Math.abs));
  let h=`<table class="season-grid"><thead><tr><th>月</th><th>年平均比</th><th style="text-align:left">安い ← → 高い</th><th>判定</th></tr></thead><tbody>`;
  s.forEach((v,i)=>{
    const w=Math.round(Math.abs(v)/maxAbs*160);
    const bar=v<0?`<span style="display:inline-block;width:160px;text-align:right"><span class="bar" style="width:${w}px;background:#2a5f7a"></span></span><span style="display:inline-block;width:160px"></span>`
                 :`<span style="display:inline-block;width:160px"></span><span style="display:inline-block;width:160px;text-align:left"><span class="bar" style="width:${w}px;background:#9c3b2e"></span></span>`;
    const j=v<=-3?"買い時":v<=-1?"やや安い":v>=3?"高い時期":v>=1?"やや高い":"平均並み";
    h+=`<tr><td>${MONTHS[i]}</td><td class="m ${cls(v)}">${v>0?"+":""}${v.toFixed(1)}%</td><td style="text-align:left">${bar}</td><td style="text-align:center" class="${v<=-1?"neg":v>=1?"pos":""}">${j}</td></tr>`;
  });
  return h+"</tbody></table>";
}
function yearTable(it,years){
  let h=`<h2>数値表（2020年平均＝100）</h2><div style="overflow-x:auto"><table><thead><tr><th>年</th>${MONTHS.map(m=>`<th>${m}</th>`).join("")}<th>年平均</th></tr></thead><tbody>`;
  years.forEach(y=>{const v=it.years[y]; const f=v.filter(x=>x!=null); const avg=f.length===12?(f.reduce((a,b)=>a+b,0)/12).toFixed(1):"―";
    h+=`<tr><td>${y}年</td>${v.map(x=>`<td>${x==null?"":x.toFixed(1)}</td>`).join("")}<td>${avg}</td></tr>`;});
  return h+"</tbody></table></div>";
}
const fmt=v=>v==null?"―":v.toFixed(1);
const pct=v=>v==null?"―":(v>0?"+":"")+v.toFixed(1)+"%";
const cls=v=>v==null?"":v<0?"neg":v>0?"pos":"";
</script>
