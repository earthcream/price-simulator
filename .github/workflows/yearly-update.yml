# 年1回更新の労務費データ（賃金構造基本統計・公共工事設計労務単価）
# - 設計労務単価: 毎年2月中旬公表 → 3月1日に取得を試行
#   ※新年度のPDF URLは scripts/fetch_annual_labor.py の ROMU_PDF を手動更新する必要がある
# - 賃金構造基本統計: 毎年3月公表・e-Stat DB反映は秋 → 12月1日に取得を試行
# 失敗した場合はGitHubからアカウントのメールに通知が届くので、手動で対応する
name: yearly-update

on:
  schedule:
    - cron: "0 0 1 3 *"    # 3月1日 09:00 JST
    - cron: "0 0 1 12 *"   # 12月1日 09:00 JST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: 年次労務データの取得
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: python scripts/fetch_annual_labor.py

      - name: 変更があればコミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/labor.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "年次労務データ更新（賃金構造基本統計・設計労務単価）"
            git push
          fi
